# mapdoc studio 配置(路径相对本文件所在目录 tools/).
# port 是「站点端口」的唯一真值: 独立运行 studio 时本服务直接监听它; 开发期由 Vite 监听同一端口,
# studio 自己改用 Vite 在回环上现取的一个内部端口(不写在这里, 也不写进 vite.config.ts).
# 不要在别处再写一份端口常量, 两处真值必然漂移. base_dir 相对每张图所在目录.

[studio]
port = 5173
open_browser = true
web_dist = "../dist"
base_dir = ".build"

[figures]
volga = "../demo/figures/Volga/volga_basin_topography_etopo2022_lambert_conformal.svg"
