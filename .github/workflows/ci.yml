name: CI

# 工程约束：typecheck / lint / test / build 四道闸门（audit/AUDIT.md §6）。
# 顺序有意安排为「最快的静态检查在前」，失败时尽早结束。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build
